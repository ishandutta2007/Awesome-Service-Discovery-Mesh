<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <radialGradient id="meshGlow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="meshGlow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      /* Dynamic animations */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }

      @keyframes dataFlow {
        from { stroke-dashoffset: 80; }
        to { stroke-dashoffset: 0; }
      }

      @keyframes dataFlowReverse {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 80; }
      }

      @keyframes beaconPing {
        0% { r: 6px; opacity: 0.9; }
        70% { r: 18px; opacity: 0; }
        100% { r: 18px; opacity: 0; }
      }

      @keyframes floatSoft {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }

      .pulse-ring-1 {
        transform-origin: 160px 100px;
        animation: beaconPing 3s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }

      .pulse-ring-2 {
        transform-origin: 1040px 110px;
        animation: beaconPing 3s cubic-bezier(0, 0.2, 0.8, 1) infinite 1.2s;
      }

      .pulse-ring-3 {
        transform-origin: 180px 320px;
        animation: beaconPing 3s cubic-bezier(0, 0.2, 0.8, 1) infinite 0.6s;
      }

      .pulse-ring-4 {
        transform-origin: 1020px 310px;
        animation: beaconPing 3s cubic-bezier(0, 0.2, 0.8, 1) infinite 1.8s;
      }

      .mesh-line-active {
        stroke-dasharray: 6 8;
        animation: dataFlow 2.4s linear infinite;
      }

      .mesh-line-active-rev {
        stroke-dasharray: 6 8;
        animation: dataFlowReverse 2.8s linear infinite;
      }

      .floating-tag {
        animation: floatSoft 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />
  <rect width="1200" height="420" fill="url(#meshGlow1)" rx="16" />
  <rect width="1200" height="420" fill="url(#meshGlow2)" rx="16" />

  <!-- Outer Border -->
  <rect x="2" y="2" width="1196" height="416" fill="none" stroke="#334155" stroke-width="1.5" rx="14" stroke-opacity="0.8" />

  <!-- DYNAMIC NETWORK MESH LAYER (Background / Middle layer) -->
  <g id="network-topology" opacity="0.85">
    <!-- Static Connecting Lines -->
    <path d="M 160 100 L 290 140 L 410 80 L 790 80 L 910 140 L 1040 110" fill="none" stroke="#1e293b" stroke-width="2" />
    <path d="M 160 100 L 180 320 L 320 280 L 880 280 L 1020 310 L 1040 110" fill="none" stroke="#1e293b" stroke-width="2" />
    <path d="M 290 140 L 320 280" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <path d="M 910 140 L 880 280" fill="none" stroke="#1e293b" stroke-width="1.5" />

    <!-- Animated Data Flow Lines -->
    <path d="M 160 100 L 290 140 L 410 80" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.8" class="mesh-line-active" filter="url(#glow)" />
    <path d="M 790 80 L 910 140 L 1040 110" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.8" class="mesh-line-active-rev" filter="url(#glow)" />
    <path d="M 160 100 L 180 320 L 320 280" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.8" class="mesh-line-active-rev" />
    <path d="M 880 280 L 1020 310 L 1040 110" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.8" class="mesh-line-active" />
    <path d="M 290 140 L 320 280" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.7" class="mesh-line-active" />
    <path d="M 910 140 L 880 280" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.7" class="mesh-line-active-rev" />

    <!-- Left Topology Nodes -->
    <circle cx="160" cy="100" r="16" fill="#0284c7" fill-opacity="0.25" class="pulse-ring-1" />
    <circle cx="160" cy="100" r="7" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="160" cy="100" r="3" fill="#ffffff" />
    <text x="160" y="80" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" text-anchor="middle" font-weight="600">API GATEWAY</text>

    <circle cx="290" cy="140" r="6" fill="#06b6d4" />
    <circle cx="290" cy="140" r="2.5" fill="#ffffff" />
    <text x="290" y="165" fill="#64748b" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" text-anchor="middle">mTLS Proxy</text>

    <circle cx="180" cy="320" r="16" fill="#10b981" fill-opacity="0.25" class="pulse-ring-3" />
    <circle cx="180" cy="320" r="7" fill="#10b981" filter="url(#glow)" />
    <circle cx="180" cy="320" r="3" fill="#ffffff" />
    <text x="180" y="348" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" text-anchor="middle" font-weight="600">CONSUL / ETCD</text>

    <circle cx="320" cy="280" r="5" fill="#38bdf8" />

    <!-- Right Topology Nodes -->
    <circle cx="1040" cy="110" r="16" fill="#818cf8" fill-opacity="0.25" class="pulse-ring-2" />
    <circle cx="1040" cy="110" r="7" fill="#818cf8" filter="url(#glow)" />
    <circle cx="1040" cy="110" r="3" fill="#ffffff" />
    <text x="1040" y="90" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" text-anchor="middle" font-weight="600">ENVOY / ISTIO</text>

    <circle cx="910" cy="140" r="6" fill="#a855f7" />
    <circle cx="910" cy="140" r="2.5" fill="#ffffff" />
    <text x="910" y="165" fill="#64748b" font-size="10" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" text-anchor="middle">Data Plane</text>

    <circle cx="1020" cy="310" r="16" fill="#c084fc" fill-opacity="0.25" class="pulse-ring-4" />
    <circle cx="1020" cy="310" r="7" fill="#c084fc" filter="url(#glow)" />
    <circle cx="1020" cy="310" r="3" fill="#ffffff" />
    <text x="1020" y="340" fill="#94a3b8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" text-anchor="middle" font-weight="600">K8S CLUSTER</text>

    <circle cx="880" cy="280" r="5" fill="#818cf8" />
  </g>

  <!-- CENTER FOREGROUND HERO CARD (Ensures Title & Subtitle Stay Clearly in Foreground) -->
  <g id="hero-content">
    <!-- Backdrop Card to prevent background interference -->
    <rect x="230" y="75" width="740" height="270" rx="18" fill="#0b1329" fill-opacity="0.88" stroke="#1e293b" stroke-width="1.5" />
    <rect x="230" y="75" width="740" height="270" rx="18" fill="url(#titleGrad)" fill-opacity="0.03" />

    <!-- Top Badge / Category Pill -->
    <g transform="translate(470, 98)" class="floating-tag">
      <rect x="0" y="0" width="260" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="14" cy="14" r="4" fill="#10b981" />
      <text x="30" y="18" fill="#38bdf8" font-size="11" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title (Crisp, High Contrast, Gradient) -->
    <text x="600" y="172" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Ubuntu, sans-serif" font-weight="900" font-size="38" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome Service Discovery &amp; Mesh
    </text>

    <!-- Subtitle (Clear, readable foreground) -->
    <text x="600" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Ubuntu, sans-serif" font-weight="500" font-size="16" fill="#cbd5e1" letter-spacing="0.2">
      Dynamic Registries, Envoy Proxies, Zero-Trust mTLS &amp; Cloud-Native Mesh
    </text>

    <text x="600" y="234" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Ubuntu, sans-serif" font-weight="400" font-size="13" fill="#94a3b8">
      A comprehensive production guide for Platform Engineers, DevOps &amp; SREs
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(265, 272)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="155" height="32" rx="16" fill="#131c31" stroke="#334155" stroke-width="1" />
      <text x="77" y="20" text-anchor="middle" fill="#38bdf8" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="600">⚡ Dynamic Registry</text>

      <!-- Pill 2 -->
      <rect x="170" y="0" width="160" height="32" rx="16" fill="#131c31" stroke="#334155" stroke-width="1" />
      <text x="250" y="20" text-anchor="middle" fill="#818cf8" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="600">🔒 mTLS Zero-Trust</text>

      <!-- Pill 3 -->
      <rect x="345" y="0" width="160" height="32" rx="16" fill="#131c31" stroke="#334155" stroke-width="1" />
      <text x="425" y="20" text-anchor="middle" fill="#c084fc" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="600">🚀 Envoy &amp; Ambient</text>

      <!-- Pill 4 -->
      <rect x="520" y="0" width="150" height="32" rx="16" fill="#131c31" stroke="#334155" stroke-width="1" />
      <text x="595" y="20" text-anchor="middle" fill="#34d399" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="600">☁️ Multi-Cloud &amp; K8s</text>
    </g>
  </g>
</svg>
